$kind: http-request
description: Replace YOUR_INDEX_NUMBER before sending. PUT replaces all editable fields.
url: "{{baseUrl}}/api/books/{{bookId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "YOUR_INDEX_NUMBER - Clean Code (Updated)",
      "author": "Robert C. Martin",
      "isbn": "9780132350884",
      "price": 4700.0
    }
scripts:
  - type: afterResponse
    code: pm.test("Expected HTTP 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 6000
